[workspace]
members = [
    "ombudsman-core",
    "ombudsman-server",
    "ombudsman-gui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"
# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
# CLI
clap = { version = "4", features = ["derive"] }
# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# Async traits
async-trait = "0.1"
# Error handling
anyhow = "1"
thiserror = "2"
# Directories
dirs = "5"
# Date/time
chrono = { version = "0.4", features = ["serde"] }
# Random IDs
rand = "0.8"
# Base64
base64 = "0.22"
# Regex
regex = "1"
# Futures utilities
futures = "0.3"
# UUID
uuid = { version = "1", features = ["v4"] }
# Interactive CLI
rustyline = "14"
# Colored terminal output
colored = "2"
# HTML parsing
scraper = "0.21"
# URL parsing
url = "2"
# MIME type detection
mime_guess = "2"
# Once cell
once_cell = "1"
# tempfile for tests
tempfile = "3"
html-escape = "0.2.13"
urlencoding = "2.1.3"
# MCP client
rmcp = { version = "1.2", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
# HTTP types
http = "1"
# WebSocket server (axum)
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
# WebSocket client
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
# GUI
iced = { version = "0.14", features = ["tokio"] }
# ombudsman-core as workspace dep
ombudsman-core = { path = "ombudsman-core" }
